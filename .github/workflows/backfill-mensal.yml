name: Backfill mensal dos indicadores

# A ANEEL publica o dado do ano corrente todo mês. Este workflow é o que torna
# o projeto uma solução recorrente, e não uma análise pontual: todo dia 2 de
# cada mês (dando um dia de folga pra publicação da ANEEL), ele baixa o
# Parquet mais recente, recalcula os indicadores e commita o seed atualizado
# — que é o arquivo que o `docker compose up` usa pra já mostrar dado real.
on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Precisa de "Read and write permissions" habilitado em Settings > Actions >
  # General > Workflow permissions do repositório, senão o `git push` falha.

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline (ingest + transform)
        run: |
          python -m pipeline.ingest
          python -m pipeline.transform

      - name: Atualizar o seed pré-processado
        run: cp data/processed/indicadores.duckdb data/seed/indicadores.duckdb

      - name: Commitar o seed se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seed/indicadores.duckdb
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos indicadores — nada a commitar."
          else
            git commit -m "chore: atualizar seed com o backfill mensal da ANEEL"
            git push
          fi
