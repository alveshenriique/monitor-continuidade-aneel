services:
  # Copia o seed pré-processado pra data/processed/ se ainda não existir, pra
  # o `docker compose up` mostrar dado real na hora, sem esperar o pipeline
  # baixar ~200MB da ANEEL. Idempotente: não sobrescreve um banco já gerado
  # por uma rodada anterior do serviço `pipeline`.
  seed:
    image: busybox:1.36
    volumes:
      - ./data:/data
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/processed
        if [ -f /data/processed/indicadores.duckdb ]; then
          echo "data/processed/indicadores.duckdb já existe, mantendo."
        else
          cp /data/seed/indicadores.duckdb /data/processed/indicadores.duckdb
          echo "Seed copiado para data/processed/indicadores.duckdb."
        fi

  api:
    build:
      context: ./api
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  # Opcional: baixa o dado mais recente da ANEEL e reprocessa os indicadores.
  # Não roda no `docker compose up` normal — só sob demanda:
  #   docker compose --profile backfill run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    profiles:
      - backfill
    volumes:
      - ./data:/app/data
